<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Denis Samatov — Machine Learning and Scientific AI</title>
<desc id="desc">Animated terminal-style GitHub profile hero with an ASCII DS monogram, rotating focus areas and technology badges.</desc>
<defs>
<style>
:root{--bg:#050816;--panel:#0a1020;--text:#e6edf7;--muted:#93a4ba;--a:#22d3ee;--b:#8b5cf6;--c:#34d399;--border:#1e2a44;--soft:#0f1a31}
@media(prefers-color-scheme:light){:root{--bg:#f7fafc;--panel:#fff;--text:#172033;--muted:#5b6b80;--a:#0891b2;--b:#7c3aed;--c:#059669;--border:#d8e2ef;--soft:#eef4fa}}
.mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.label{font:600 13px "SFMono-Regular",Consolas,monospace;fill:var(--muted);letter-spacing:.8px}.prompt{font:600 15px "SFMono-Regular",Consolas,monospace;fill:var(--a)}.terminal{font:500 14px "SFMono-Regular",Consolas,monospace;fill:var(--text)}.ascii{font:700 22px "SFMono-Regular",Consolas,monospace;fill:url(#ascii);letter-spacing:0}.name{font:760 43px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--text);letter-spacing:1px}.role{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--muted)}.phrase{font:650 20px "SFMono-Regular",Consolas,monospace;fill:var(--a);opacity:0;animation:cycle 15s infinite}.p1{opacity:1}.p2{animation-delay:3s}.p3{animation-delay:6s}.p4{animation-delay:9s}.p5{animation-delay:12s}.pill{transform-box:fill-box;transform-origin:center;transition:transform .25s ease,filter .25s ease}.pill:hover{transform:translateY(-2px) scale(1.035);filter:drop-shadow(0 4px 8px #22d3ee55)}.pillText{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--text)}.tiny{font:500 12px "SFMono-Regular",Consolas,monospace;fill:var(--muted)}.cursor{animation:blink .9s steps(1) infinite}.float1{animation:f1 14s ease-in-out infinite}.float2{animation:f2 18s ease-in-out infinite}.particle{animation:pulse 4s ease-in-out infinite}.particle:nth-child(2n){animation-delay:1.2s}.particle:nth-child(3n){animation-delay:2.4s}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes cycle{0%,16%{opacity:1;transform:translateY(0)}20%,100%{opacity:0;transform:translateY(-4px)}}@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,28px)}}@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-22px)}}@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.phrase,.cursor,.float1,.float2,.particle{animation:none!important}.phrase{opacity:0}.p1{opacity:1}}
</style>
<linearGradient id="ascii" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a)"><animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#34d399;#22d3ee" dur="9s" repeatCount="indefinite"/></stop><stop offset=".52" stop-color="var(--b)"/><stop offset="1" stop-color="var(--c)"/></linearGradient>
<radialGradient id="oa"><stop offset="0" stop-color="var(--a)" stop-opacity=".18"/><stop offset="1" stop-color="var(--a)" stop-opacity="0"/></radialGradient><radialGradient id="ob"><stop offset="0" stop-color="var(--b)" stop-opacity=".16"/><stop offset="1" stop-color="var(--b)" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--muted)" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1180" height="610" rx="24" fill="var(--bg)"/><rect width="1180" height="610" rx="24" fill="url(#grid)"/><g class="float1"><circle cx="180" cy="125" r="260" fill="url(#oa)"/></g><g class="float2"><circle cx="980" cy="475" r="300" fill="url(#ob)"/></g>
<g fill="var(--a)"><circle class="particle" cx="82" cy="86" r="1.8"/><circle class="particle" cx="462" cy="520" r="1.5"/><circle class="particle" cx="1060" cy="95" r="1.7"/><circle class="particle" cx="1092" cy="348" r="1.3"/><circle class="particle" cx="740" cy="92" r="1.2"/><circle class="particle" cx="620" cy="540" r="1.6"/></g>
<rect x="38" y="38" width="402" height="534" rx="18" fill="var(--panel)" stroke="var(--border)"/><circle cx="66" cy="65" r="5" fill="#ff5f57"/><circle cx="84" cy="65" r="5" fill="#ffbd2e"/><circle cx="102" cy="65" r="5" fill="#28c840"/><text x="122" y="70" class="label">denis@github — scientific-ai</text>
<text x="64" y="108" class="prompt">$</text><text x="82" y="108" class="terminal">neofetch --profile</text><path d="M64 125H414" stroke="var(--border)"/>
<g class="ascii"><text x="66" y="170">########    ########</text><text x="66" y="205">##     ##   ##</text><text x="66" y="240">##      ##  ##</text><text x="66" y="275">##      ##  #######</text><text x="66" y="310">##      ##       ##</text><text x="66" y="345">##     ##        ##</text><text x="66" y="380">########    #######</text></g>
<text x="66" y="438" class="terminal"><tspan fill="var(--a)">user</tspan><tspan fill="var(--muted)">@</tspan><tspan fill="var(--b)">denis-samatov</tspan></text><text x="66" y="466" class="tiny">OS      Scientific AI / ML</text><text x="66" y="488" class="tiny">Kernel  Python · PyTorch · LLM</text><text x="66" y="510" class="tiny">Focus   research → production</text><text x="66" y="532" class="tiny">Status  building reliable AI systems</text><text x="66" y="553" class="prompt">&gt; ready</text><rect x="132" y="541" width="9" height="15" rx="1" fill="var(--a)" class="cursor"/>
<text x="520" y="112" class="label">PROFILE / 2026</text><text x="520" y="172" class="name">DENIS SAMATOV</text><text x="520" y="211" class="role">Machine Learning Engineer · Data Scientist</text><path d="M520 240H1105" stroke="var(--border)"/><text x="520" y="272" class="prompt">$ current_focus</text><text x="520" y="302" class="phrase p1">Machine Learning Engineer</text><text x="520" y="302" class="phrase p2">Scientific AI Research</text><text x="520" y="302" class="phrase p3">RAG &amp; Agentic Systems</text><text x="520" y="302" class="phrase p4">Computer Vision / Radiomics</text><text x="520" y="302" class="phrase p5">Tensor Methods &amp; Scientific Computing</text><rect x="520" y="326" width="9" height="18" rx="1" fill="var(--a)" class="cursor"/><text x="520" y="365" class="label">CORE STACK</text>
<g class="pill"><rect x="520" y="388" width="96" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="568" y="410" text-anchor="middle" class="pillText">PyTorch</text></g><g class="pill"><rect x="626" y="388" width="68" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="660" y="410" text-anchor="middle" class="pillText">RAG</text></g><g class="pill"><rect x="704" y="388" width="132" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="770" y="410" text-anchor="middle" class="pillText">CV / Radiomics</text></g><g class="pill"><rect x="846" y="388" width="88" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="890" y="410" text-anchor="middle" class="pillText">FastAPI</text></g><g class="pill"><rect x="944" y="388" width="84" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="986" y="410" text-anchor="middle" class="pillText">Qdrant</text></g><g class="pill"><rect x="520" y="434" width="132" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="586" y="456" text-anchor="middle" class="pillText">Tensor Methods</text></g><g class="pill"><rect x="662" y="434" width="116" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="720" y="456" text-anchor="middle" class="pillText">LLM Systems</text></g><g class="pill"><rect x="788" y="434" width="122" height="34" rx="17" fill="var(--soft)" stroke="var(--border)"/><text x="849" y="456" text-anchor="middle" class="pillText">Scientific AI</text></g>
<path d="M520 498H1105" stroke="var(--border)"/><text x="520" y="530" class="tiny">Medical Imaging • RAG • Agentic Systems • Tensor Decomposition • Scientific Computing</text><text x="520" y="556" class="tiny">github.com/denis-samatov</text><circle cx="1090" cy="554" r="5" fill="var(--c)"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="1102" y="558" class="tiny">ONLINE</text>
</svg>